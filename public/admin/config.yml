# Decap CMS 設定檔
# 部署後、設定好 GitHub 登入,就能在「你的網址/admin」用 GitHub 帳號登入發文。
# 網站各頁的「編輯」按鈕會直接連到這裡對應的項目,例如 /admin/#/collections/blog/entries/檔名

backend:
  name: github
  repo: DavidLoman5/personal-website # 之後若 repo 名稱不同,改這裡
  branch: main

# 後台上傳的圖片會存到這裡,網頁用 /uploads/... 引用
media_folder: public/uploads
public_folder: /uploads

# 後台介面語言（zh_Hant = 繁體中文;Decap CMS 有正式繁體翻譯）
locale: zh_Hant

collections:
  # ---------- 心得 / Blog ----------
  - name: blog
    label: 心得
    label_singular: 心得
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: 標題, widget: string }
      - {
          name: date,
          label: 日期,
          widget: datetime,
          format: 'YYYY-MM-DD',
          date_format: 'YYYY-MM-DD',
          time_format: false,
        }
      - { name: summary, label: 摘要, widget: text, required: false, hint: 顯示在列表上的一兩句話 }
      - { name: tags, label: 標籤, widget: list, required: false, default: [] }
      - { name: cover, label: 封面圖, widget: image, required: false }
      - {
          name: cover_alt,
          label: 封面圖說明,
          widget: string,
          required: false,
          hint: 給看不到圖的人聽的一句描述；留空就當純裝飾圖,
        }
      - { name: draft, label: 草稿（勾選則不公開）, widget: boolean, default: false }
      - { name: body, label: 內文, widget: markdown }

  # ---------- 目標 / Goals ----------
  - name: goals
    label: 目標
    label_singular: 目標
    folder: src/content/goals
    create: true
    slug: '{{slug}}'
    fields:
      - { name: title, label: 目標, widget: string }
      - {
          name: term,
          label: 類型,
          widget: select,
          options:
            [
              { label: 短期, value: short },
              { label: 長期, value: long },
            ],
          default: short,
        }
      - {
          name: status,
          label: 狀態,
          widget: select,
          options:
            [
              { label: 待開始, value: todo },
              { label: 進行中, value: doing },
              { label: 已完成, value: done },
            ],
          default: todo,
        }
      - { name: order, label: 排序（數字小的在前）, widget: number, default: 0, value_type: int }
      - {
          name: target_date,
          label: 目標日期,
          widget: datetime,
          required: false,
          format: 'YYYY-MM-DD',
          date_format: 'YYYY-MM-DD',
          time_format: false,
        }
      - { name: draft, label: 草稿（勾選則不公開）, widget: boolean, default: false }
      - { name: body, label: 說明, widget: markdown, required: false }

  # ---------- 作品 / Projects ----------
  - name: projects
    label: 作品
    label_singular: 作品
    folder: src/content/projects
    create: true
    slug: '{{slug}}'
    fields:
      - { name: title, label: 標題, widget: string }
      - {
          name: date,
          label: 日期,
          widget: datetime,
          format: 'YYYY-MM-DD',
          date_format: 'YYYY-MM-DD',
          time_format: false,
        }
      - { name: summary, label: 簡介, widget: text, required: false }
      - { name: tags, label: 標籤, widget: list, required: false, default: [] }
      - { name: cover, label: 封面圖, widget: image, required: false }
      - {
          name: cover_alt,
          label: 封面圖說明,
          widget: string,
          required: false,
          hint: 給看不到圖的人聽的一句描述；留空就當純裝飾圖,
        }
      - {
          name: link,
          label: 外部連結（選填）,
          widget: string,
          required: false,
          pattern: ['^https?://.+', '要填完整網址，開頭要有 https://'],
        }
      - { name: order, label: 排序（數字小的在前）, widget: number, default: 0, value_type: int }
      - { name: draft, label: 草稿（勾選則不公開）, widget: boolean, default: false }
      - { name: body, label: 說明, widget: markdown, required: false }

  # ---------- 單一頁面（首頁封面、關於我） ----------
  - name: pages
    label: 頁面
    files:
      - name: home
        label: 首頁封面
        file: src/content/home.md
        fields:
          - { name: quote, label: 名言, widget: text, hint: 顯示在首頁最上方的那句話 }
      - name: about
        label: 關於我
        file: src/content/about.md
        fields:
          - { name: title, label: 頁面標題, widget: string, default: About }
          - { name: photo, label: 個人照片, widget: image, required: false }
          - { name: body, label: 內容, widget: markdown }

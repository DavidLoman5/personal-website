# Netlify 部署設定
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 注意:網址是 /about 而不是 /about/index.html,所以規則要寫 /* 才吃得到。
# max-age=30 是刻意的 —— 預抓回來的頁面如果是 max-age=0,點下去瀏覽器還是要回源
# 問一次「有沒有更新」(304),預抓就白做了。給 30 秒的新鮮期,點擊才是真正的零等待;
# 代價是從 /admin 發文後最多 30 秒才會看到,重新整理則會立刻拿到新的。
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=30, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 檔名帶 hash,可以永久快取
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 後台上傳的圖片:Decap 會沿用原檔名,所以不能設 immutable,免得重傳同名檔看不到新的
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# 後台設定改了要立刻生效
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
